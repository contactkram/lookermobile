<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">
<title>Buttons</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-canvas); }
  body { padding: 20px; font-family: var(--font-text); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button { font-family: var(--font-brand); font-weight: 500; font-size: 14px; border: none; cursor: pointer; padding: 0 20px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; transition: all 150ms cubic-bezier(0.2,0,0,1); letter-spacing: 0.01em;}
  .filled { background: #1A73E8; color: #fff; }
  .filled:hover { box-shadow: var(--elev-1); background: #1B6FE0;}
  .tonal { background: var(--google-blue-100); color: var(--google-blue-800); }
  .outlined { background: transparent; color: #1A73E8; border: 1px solid var(--grey-300); }
  .text { background: transparent; color: #1A73E8; padding: 0 12px; }
  .fab { width: 56px; height: 56px; border-radius: 16px; background: var(--google-blue-100); color: var(--google-blue-800); padding: 0; box-shadow: var(--elev-2);}
  .destructive { background: transparent; color: #D93025; padding: 0 12px;}
  .material-symbols-rounded { font-size: 18px; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body>
  <button class="filled">Apply filters</button>
  <button class="tonal"><span class="material-symbols-rounded">star</span>Favorite</button>
  <button class="outlined">Cancel</button>
  <button class="text">Learn more</button>
  <button class="destructive">Remove</button>
  <button class="fab" title="New"><span class="material-symbols-rounded" style="font-size:24px">add</span></button>
</body>
</html>
