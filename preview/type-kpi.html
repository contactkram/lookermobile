<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<title>KPI numerals</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-canvas); }
  body { padding: 18px; font-family: var(--font-text); display: flex; gap: 28px; align-items: center; }
  .kpi { display: flex; flex-direction: column; gap: 4px; }
  .kpi .label { font-size: 12px; color: var(--fg-tertiary); text-transform: uppercase; letter-spacing: .04em; font-weight: 500;}
  .kpi .value { font-family: var(--font-brand); font-weight: 500; font-size: 36px; letter-spacing: -1px; line-height: 1; font-feature-settings: "tnum" 1, "lnum" 1; color: var(--fg-primary); }
  .delta { font-family: var(--font-brand); font-weight: 500; font-size: 13px; font-feature-settings: "tnum"; }
  .pos { color: #1E8E3E; }
  .neg { color: #D93025; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); margin-top: 4px; }
</style>
</head>
<body>
  <div class="kpi">
    <div class="label">Revenue</div>
    <div class="value">$1.24M</div>
    <div class="delta pos">▲ +12.4% vs LW</div>
  </div>
  <div class="kpi">
    <div class="label">Pipeline</div>
    <div class="value">$8.92M</div>
    <div class="delta neg">▼ −3.1% vs LW</div>
  </div>
  <div class="kpi">
    <div class="label">Win rate</div>
    <div class="value">28.6%</div>
    <div class="delta pos">▲ +1.2pp</div>
  </div>
  <div class="kpi" style="margin-left:auto">
    <div class="meta">tabular figures · minus glyph (−) not hyphen</div>
    <div class="meta">always signed deltas · Google Sans 500</div>
  </div>
</body>
</html>
