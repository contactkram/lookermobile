<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<title>Elevation</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-grouped); }
  body { padding: 24px 14px; font-family: var(--font-text); display: flex; align-items: center; justify-content: space-around; gap: 12px; }
  .tile { width: 80px; height: 80px; background: #fff; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; color: var(--fg-secondary); font-family: var(--font-mono); font-size: 10px; padding-bottom: 6px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); }
</style>
</head>
<body>
  <div class="col"><div class="tile" style="border:1px solid var(--hairline)">0</div><div class="lbl">flat · rest</div></div>
  <div class="col"><div class="tile" style="box-shadow:var(--elev-1)">1</div><div class="lbl">selected</div></div>
  <div class="col"><div class="tile" style="box-shadow:var(--elev-2)">2</div><div class="lbl">menu</div></div>
  <div class="col"><div class="tile" style="box-shadow:var(--elev-3)">3</div><div class="lbl">sheet</div></div>
  <div class="col"><div class="tile" style="box-shadow:var(--elev-4)">4</div><div class="lbl">FAB / dialog</div></div>
</body>
</html>
