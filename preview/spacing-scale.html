<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<title>Spacing scale</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-canvas); }
  body { padding: 16px; font-family: var(--font-text); display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 10px; height: 18px; }
  .token { font-family: var(--font-mono); font-size: 11px; color: var(--fg-secondary); width: 70px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); width: 44px; }
  .bar { background: var(--google-blue-500); height: 12px; border-radius: 2px; }
  .footer { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row"><div class="token">--sp-1</div><div class="px">4px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="token">--sp-2</div><div class="px">8px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="token">--sp-3</div><div class="px">12px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="token">--sp-4</div><div class="px">16px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="token">--sp-5</div><div class="px">20px</div><div class="bar" style="width:20px"></div></div>
  <div class="row"><div class="token">--sp-6</div><div class="px">24px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="token">--sp-7</div><div class="px">32px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="token">--sp-8</div><div class="px">40px</div><div class="bar" style="width:40px"></div></div>
  <div class="row"><div class="token">--sp-9</div><div class="px">48px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="token">--sp-10</div><div class="px">64px</div><div class="bar" style="width:64px"></div></div>
  <div class="footer">4-pt grid · 16px default screen gutter · 44pt min hit target</div>
</body>
</html>
