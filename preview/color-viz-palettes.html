<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<title>Data viz palettes</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-canvas); font-family: var(--font-text); }
  body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); width: 88px; text-align: right; text-transform: uppercase; letter-spacing: .04em; }
  .swatches { display: flex; flex: 1; height: 38px; border-radius: 6px; overflow: hidden; }
  .sw { flex: 1; }
</style>
</head>
<body>
  <div class="row"><div class="label">Categorical</div><div class="swatches">
    <div class="sw" style="background:#4285F4"></div>
    <div class="sw" style="background:#EA4335"></div>
    <div class="sw" style="background:#FBBC04"></div>
    <div class="sw" style="background:#34A853"></div>
    <div class="sw" style="background:#FF6D01"></div>
    <div class="sw" style="background:#46BDC6"></div>
    <div class="sw" style="background:#7B61FF"></div>
    <div class="sw" style="background:#B31412"></div>
  </div></div>
  <div class="row"><div class="label">Sequential</div><div class="swatches">
    <div class="sw" style="background:#E8F0FE"></div>
    <div class="sw" style="background:#AECBFA"></div>
    <div class="sw" style="background:#669DF6"></div>
    <div class="sw" style="background:#1A73E8"></div>
    <div class="sw" style="background:#174EA6"></div>
  </div></div>
  <div class="row"><div class="label">Diverging</div><div class="swatches">
    <div class="sw" style="background:#B31412"></div>
    <div class="sw" style="background:#F28B82"></div>
    <div class="sw" style="background:#F1F3F4"></div>
    <div class="sw" style="background:#AECBFA"></div>
    <div class="sw" style="background:#1A73E8"></div>
  </div></div>
</body>
</html>
