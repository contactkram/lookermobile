<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">
<title>Input fields</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-canvas); }
  body { padding: 18px; font-family: var(--font-text); display: flex; flex-direction: column; gap: 12px;}
  .search { display: flex; align-items: center; gap: 8px; background: var(--grey-100); border-radius: 10px; padding: 0 12px; height: 36px; color: var(--fg-tertiary);}
  .search input { flex: 1; background: transparent; border: none; outline: none; font: inherit; color: var(--fg-primary); font-size: 15px;}
  .field { display: flex; flex-direction: column; gap: 6px;}
  .label { font-size: 12px; color: var(--fg-secondary); font-weight: 500;}
  .input { height: 44px; border: 1px solid var(--grey-300); border-radius: 8px; padding: 0 14px; font: inherit; font-size: 15px; outline: none;}
  .input:focus { border-color: #1A73E8; box-shadow: 0 0 0 1px #1A73E8;}
  .row { display: flex; gap: 6px; flex-wrap: wrap;}
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px 4px 12px; background: var(--google-blue-100); color: var(--google-blue-800); border-radius: 999px; font-size: 13px; font-weight: 500; font-family: var(--font-text);}
  .chip .material-symbols-rounded { font-size: 16px; cursor: pointer;}
  .material-symbols-rounded { font-size: 20px; }
</style>
</head>
<body>
  <div class="search">
    <span class="material-symbols-rounded">search</span>
    <input placeholder="Search dashboards" value="">
  </div>
  <div class="field">
    <div class="label">Region filter</div>
    <input class="input" value="California">
  </div>
  <div class="row">
    <span class="chip">State: California <span class="material-symbols-rounded">close</span></span>
    <span class="chip">Q4 2026 <span class="material-symbols-rounded">close</span></span>
    <span class="chip">Win rate &gt; 25% <span class="material-symbols-rounded">close</span></span>
  </div>
</body>
</html>
