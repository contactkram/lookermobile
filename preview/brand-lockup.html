<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<title>Brand</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-canvas); }
  body { padding: 20px; display: flex; align-items: center; gap: 24px; }
  .icon-wrap { width: 88px; height: 88px; flex: 0 0 88px; }
  .word { font-family: var(--font-brand); font-size: 44px; font-weight: 500; color: #202124; letter-spacing: -1px; line-height: 1; }
  .meta { font-family: var(--font-text); font-size: 12px; color: var(--fg-tertiary); margin-top: 6px; }
  .chip { display: inline-block; padding: 2px 8px; background: var(--grey-100); color: var(--fg-secondary); font-family: var(--font-mono); font-size: 11px; border-radius: 4px; margin-right: 4px; }
</style>
</head>
<body>
  <img class="icon-wrap" src="../assets/looker-app-icon.svg" alt="">
  <div>
    <div class="word">Looker</div>
    <div class="meta">
      <span class="chip">Google Sans 500</span>
      <span class="chip">#4285F4</span>
      <span class="chip">radius 22pt</span>
    </div>
  </div>
</body>
</html>
